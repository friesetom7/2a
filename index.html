<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nemos Übungsspielplatz</title>
<style>
/* Layout: one-screen ocean app. Top bar (back, coins), then one screen at a time:
   start → home (chapters) → chapter map (islands × difficulty) → intro → play → result. */
:root {
  --deep: #0b3a5c;
  --sea: #1270a8;
  --shallow: #3fb4d8;
  --sand: #fff4dc;
  --sand-edge: #e9cf98;
  --ink: #17324a;
  --muted: #6b5a33;
  --gold: #ffd75e;
  --gold-edge: #c9971f;
  --der: #1f6fd1;
  --die: #d6342f;
  --das: #23964a;
  --good: #23964a;
  --bad: #d6342f;
  --easy: #3fa9d8;
  --mid: #a8743a;
  --hard: #6b7480;
  --gem: #2bb6c9;
  --white: #ffffff;
  --shadow: rgba(4, 30, 52, 0.35);
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; margin: 0; }
body {
  background: var(--deep);
  background-image: linear-gradient(180deg, var(--shallow) 0%, var(--sea) 38%, var(--deep) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font);
  font-size: 20px;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow-x: hidden;
}
button { font-family: inherit; color: inherit; cursor: pointer; border: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
button:disabled { cursor: default; }

.app { min-height: 100vh; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(10px, env(safe-area-inset-top, 0px)) 28px; max-width: 1000px; margin: 0 auto; box-sizing: border-box; position: relative; z-index: 1; }

.rays { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: repeating-linear-gradient(100deg, rgba(255,255,255,0.07) 0 40px, rgba(255,255,255,0) 40px 120px); mask-image: linear-gradient(180deg, #000 0%, transparent 60%); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 60%); }
.bub { position: fixed; bottom: -40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.08); pointer-events: none; z-index: 0; animation: rise linear infinite; }
@keyframes rise { to { transform: translateY(-115vh) translateX(20px); } }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; min-height: 64px; }
.bar .spacer { flex: 1; }
.iconbtn { width: 60px; height: 60px; border-radius: 50%; background: var(--sand); font-size: 28px; box-shadow: 0 4px 0 var(--sand-edge), 0 6px 14px var(--shadow); display: grid; place-items: center; flex: none; }
.iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sand-edge); }
.wallet { display: flex; align-items: center; gap: 8px; background: rgba(4, 30, 52, 0.5); color: var(--white); border-radius: 40px; padding: 6px 18px 6px 8px; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.coin { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c9, var(--gold) 55%, #d9a72a); box-shadow: inset 0 0 0 3px #e6b43a, 0 0 10px rgba(255,215,94,.7); color: #9a6a00; font-size: 18px; font-weight: 900; }
.coin::before { content: "N"; }
.coin.sm { width: 24px; height: 24px; font-size: 13px; box-shadow: inset 0 0 0 2px #e6b43a; vertical-align: -5px; }
.wallet.bump { animation: bump .45s; }
@keyframes bump { 40% { transform: scale(1.22); } }

.screen { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-top: 8px; }
.card { background: var(--sand); border-radius: 28px; box-shadow: 0 6px 0 var(--sand-edge), 0 12px 28px var(--shadow); padding: 22px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.big-btn { background: var(--gold); color: var(--ink); font-size: 28px; font-weight: 900; padding: 16px 36px; border-radius: 999px; box-shadow: 0 6px 0 var(--gold-edge), 0 10px 20px var(--shadow); align-self: center; }
.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gold-edge); }
.big-btn.ghost { background: var(--sand); box-shadow: 0 6px 0 var(--sand-edge), 0 10px 20px var(--shadow); font-size: 24px; padding: 14px 28px; }
.head { color: var(--white); text-align: center; font-weight: 900; text-shadow: 0 3px 0 var(--deep); }
.head.xl { font-size: clamp(36px, 7vw, 60px); line-height: 1.05; text-shadow: 0 4px 0 var(--deep), 0 8px 18px var(--shadow); }
.head.l { font-size: clamp(28px, 5vw, 38px); }
.head.s { font-size: 22px; font-weight: 700; }

/* start */
.center { align-items: center; justify-content: center; text-align: center; }
.nemo { font-size: 110px; line-height: 1; display: inline-block; animation: swim 3s ease-in-out infinite; filter: drop-shadow(0 10px 12px var(--shadow)); }
@keyframes swim { 0%,100% { transform: translateX(-16px) rotate(-4deg); } 50% { transform: translateX(16px) rotate(4deg); } }
.start .card { display: flex; flex-direction: column; gap: 14px; width: min(520px, 100%); box-sizing: border-box; }
.start label { font-size: 26px; font-weight: 800; }
#nameInput { font: inherit; font-size: 32px; text-align: center; padding: 12px; border-radius: 18px; border: 3px solid var(--sand-edge); background: var(--white); color: var(--ink); width: 100%; box-sizing: border-box; -webkit-user-select: text; user-select: text; }

/* home: chapters */
.chapters { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.chapter { background: var(--sand); border-radius: 32px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; box-shadow: 0 7px 0 var(--sand-edge), 0 14px 26px var(--shadow); }
.chapter:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 3px 0 var(--sand-edge); }
.chapter .ic { font-size: 72px; line-height: 1; }
.chapter .nm { font-size: 34px; font-weight: 900; }
.chapter .sb { font-size: 20px; font-weight: 700; color: var(--muted); }
.chapter .pg { font-size: 20px; font-weight: 800; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.chapter:disabled { opacity: .7; }
.chapter .soon { background: var(--white); border-radius: 999px; padding: 6px 16px; font-size: 20px; font-weight: 800; }
.foot { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.reset { background: transparent; color: rgba(255,255,255,0.75); font-size: 16px; text-decoration: underline; padding: 8px; }

/* chapter map */
.legend { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.legend span { background: rgba(4,30,52,.45); color: var(--white); border-radius: 999px; padding: 6px 14px; font-size: 18px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
.islands { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.island { background: var(--sand); border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 0 var(--sand-edge), 0 12px 24px var(--shadow); position: relative; }
.island .top { display: flex; align-items: center; gap: 14px; }
.island .ic { width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 36px; background: var(--white); border: 4px solid var(--c, var(--sea)); }
.island .nm { font-size: 25px; font-weight: 900; flex: 1; min-width: 0; }
.island .gem { font-size: 28px; }
.island .gem.off { filter: grayscale(1) opacity(.25); }
.diffs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.diff { border-radius: 18px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--white); font-weight: 900; }
.diff .di { font-size: 30px; line-height: 1.1; }
.diff .dl { font-size: 17px; }
.diff .ds { font-size: 13px; letter-spacing: 1px; min-height: 18px; }
.diff.leicht { background: var(--easy); box-shadow: 0 5px 0 #2a7ea3; }
.diff.mittel { background: var(--mid); box-shadow: 0 5px 0 #7a5228; }
.diff.schwer { background: var(--hard); box-shadow: 0 5px 0 #474e57; }
.diff.experte { background: linear-gradient(160deg, #1b2a4a, #0b3a5c); box-shadow: 0 5px 0 #08162b; color: var(--gold); }
.diff:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.bonus-card { background: linear-gradient(135deg, #fff4dc, #ffe7a3); border-radius: 28px; padding: 18px; display: flex; align-items: center; gap: 16px; box-shadow: 0 6px 0 var(--gold-edge), 0 12px 24px var(--shadow); text-align: left; width: 100%; box-sizing: border-box; }
.bonus-card .ic { font-size: 56px; line-height: 1; flex: none; }
.bonus-card .nm { font-size: 26px; font-weight: 900; display: block; }
.bonus-card .ds { font-size: 19px; font-weight: 700; color: var(--muted); display: block; margin-top: 2px; }
.bonus-card:disabled { background: var(--sand); box-shadow: 0 6px 0 var(--sand-edge), 0 12px 24px var(--shadow); }
.bonus-card:disabled .ic { filter: grayscale(.7); }
.bonus-card:active:not(:disabled) { transform: translateY(4px); }

/* level */
.progress { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.progress i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.7); box-sizing: border-box; }
.progress i.on { background: var(--gold); border-color: var(--gold); }
.taskrow { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 14px; font-size: 18px; font-weight: 900; color: var(--white); }
.badge.leicht { background: var(--easy); } .badge.mittel { background: var(--mid); } .badge.schwer { background: var(--hard); } .badge.experte { background: #1b2a4a; color: var(--gold); } .badge.bonus { background: #e0a400; }
.task { color: var(--white); text-align: center; font-size: 27px; font-weight: 900; text-shadow: 0 3px 0 var(--deep); }
.say { width: 52px; height: 52px; font-size: 24px; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.shake { animation: shake .45s; }
@keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
.hint { min-height: 64px; display: flex; align-items: center; justify-content: center; }
.hint span { background: var(--white); color: var(--ink); border-radius: 22px; padding: 12px 20px; font-size: 22px; font-weight: 700; box-shadow: 0 6px 16px var(--shadow); text-align: center; max-width: 680px; }
.hint span.good { background: #e3f6e8; color: #145c2c; }

/* fishing */
.pond { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: min(720px, 100%); }
.pond.two { grid-template-columns: repeat(2, minmax(0, 1fr)); width: min(520px, 100%); }
.wbub { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.95), rgba(220,242,252,0.92) 40%, rgba(160,215,240,0.9)); border: 4px solid rgba(255,255,255,0.9); font-size: clamp(22px, 4.2vw, 36px); font-weight: 800; color: var(--ink); box-shadow: 0 10px 22px var(--shadow); animation: bob 3.2s ease-in-out infinite; display: grid; place-items: center; padding: 6px; overflow-wrap: anywhere; }
.pond.nine { width: min(540px, 100%); gap: 12px; }
.pond.nine .wbub { font-size: clamp(17px, 3.2vw, 27px); }
.wbub:nth-child(2n) { animation-delay: -1.1s; } .wbub:nth-child(3n) { animation-delay: -2s; }
@keyframes bob { 50% { transform: translateY(-10px); } }
.wbub.got { background: radial-gradient(circle at 32% 28%, #fffbe8, var(--gold) 60%, #e0ae2e); border-color: #fff3c4; }
.wbub.no { animation: shake .45s; }

/* sentence gap */
.sentence { font-size: clamp(28px, 5vw, 42px); font-weight: 800; text-align: center; line-height: 1.5; color: var(--white); text-shadow: 0 3px 0 var(--deep); }
.gap { display: inline-block; min-width: 140px; border-bottom: 5px dashed var(--gold); color: var(--gold); padding: 0 6px; }
.emoji-big { font-size: 100px; line-height: 1; filter: drop-shadow(0 8px 10px var(--shadow)); }
.choices { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.choice { background: var(--sand); font-size: clamp(32px, 6vw, 46px); font-weight: 800; padding: 14px 36px; border-radius: 26px; min-width: 180px; box-shadow: 0 6px 0 var(--sand-edge), 0 10px 20px var(--shadow); }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sand-edge); }
.choice.right { background: #c9f0d4; box-shadow: 0 6px 0 #8fd3a3; }

/* articles */
.word-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 36px; min-width: 260px; box-sizing: border-box; max-width: 100%; }
.word-card .w { font-size: clamp(40px, 8vw, 62px); font-weight: 900; overflow-wrap: anywhere; text-align: center; }
.word-card .w b { margin-right: 12px; }
.arts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; width: min(640px, 100%); }
.art { color: var(--white); font-size: clamp(32px, 6vw, 46px); font-weight: 900; padding: 20px 6px; border-radius: 26px; }
.art.der { background: var(--der); box-shadow: 0 7px 0 #154f97, 0 12px 20px var(--shadow); }
.art.die { background: var(--die); box-shadow: 0 7px 0 #962320, 0 12px 20px var(--shadow); }
.art.das { background: var(--das); box-shadow: 0 7px 0 #176a33, 0 12px 20px var(--shadow); }
.art:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.c-der { color: var(--der); } .c-die { color: var(--die); } .c-das { color: var(--das); }

/* baskets */
.baskets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; width: 100%; }
.basket { background: var(--sand); border-radius: 26px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 6px 0 var(--sand-edge), 0 10px 18px var(--shadow); border: 4px solid transparent; }
.basket .bi { font-size: 48px; line-height: 1; }
.basket .bn { font-size: clamp(17px, 2.6vw, 23px); font-weight: 900; }
.basket:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sand-edge); }
.basket.flash { border-color: var(--good); background: #e3f6e8; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 880px; }
.chip { background: var(--sand); font-size: clamp(26px, 4.6vw, 40px); font-weight: 800; padding: 10px 20px; border-radius: 20px; box-shadow: 0 5px 0 var(--sand-edge), 0 8px 14px var(--shadow); border: 4px solid transparent; }
.chip.on { background: var(--gold); border-color: #fff3c4; box-shadow: 0 5px 0 var(--gold-edge); }
.chip.miss { border-color: var(--bad); }
.counter { color: var(--white); font-size: 23px; font-weight: 800; text-align: center; }

/* intro / result */
.intro-card { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 640px; text-align: center; }
.intro-card .ic { font-size: 84px; line-height: 1; }
.intro-card h2 { font-size: 36px; font-weight: 900; }
.intro-card p { margin: 0; font-size: 25px; font-weight: 700; line-height: 1.35; }
.intro-card .ex { background: var(--white); border-radius: 18px; padding: 12px 20px; font-size: 25px; font-weight: 800; }
.stars-big { font-size: 74px; letter-spacing: 8px; }
.off { filter: grayscale(1) opacity(.3); }
.earned { font-size: 30px; font-weight: 900; display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; }
.banner { background: #e3f6e8; color: #145c2c; border-radius: 18px; padding: 10px 18px; font-size: 22px; font-weight: 800; }
.banner.gold { background: #fff0c2; color: #6b4b00; }
.btnrow { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

/* certificate */
.cert { max-width: 640px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; border: 8px double var(--sand-edge); }
.cert .nm { font-size: clamp(40px, 8vw, 60px); font-weight: 900; color: var(--sea); }
.cert p { margin: 0; font-size: 25px; font-weight: 700; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.confetti span { position: absolute; top: -60px; font-size: 40px; animation: fall 2.4s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
.flycoin { position: fixed; z-index: 6; pointer-events: none; transition: transform .6s cubic-bezier(.5,-0.3,.6,1), opacity .6s; }
.overlay { position: fixed; inset: 0; background: rgba(4, 30, 52, 0.6); z-index: 10; display: grid; place-items: center; padding: 16px; }
.overlay .card { max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 16px; }

/* two big answer buttons (Satz? / Einzahl?) */
.opts { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: min(820px, 100%); }
.opt { background: var(--sand); font-size: clamp(26px, 4.8vw, 40px); font-weight: 800; padding: 14px 26px; border-radius: 24px; box-shadow: 0 6px 0 var(--sand-edge), 0 10px 20px var(--shadow); min-width: 160px; }
.opt.small { font-size: clamp(22px, 4vw, 32px); }
.opt:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sand-edge); }
.opt.right { background: #c9f0d4; box-shadow: 0 6px 0 #8fd3a3; }
.opt.yes { background: #d8f3df; } .opt.no { background: #fde1df; }
.qline { font-size: clamp(30px, 5.4vw, 48px); font-weight: 900; text-align: center; overflow-wrap: anywhere; color: var(--white); text-shadow: 0 3px 0 var(--deep); }
.card .qline { color: var(--ink); text-shadow: none; }
.qline.serif { letter-spacing: .5px; }
.emo-row { font-size: 64px; line-height: 1.1; text-align: center; }

/* aquarium */
.aq-stat { background: var(--sand); border-radius: 22px; padding: 12px 18px; box-shadow: 0 5px 0 var(--sand-edge), 0 8px 16px var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.aq-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 19px; font-weight: 800; }
.aq-bar { flex: 1; min-width: 140px; height: 16px; border-radius: 99px; background: #e9dcc0; overflow: hidden; }
.aq-bar i { display: block; height: 100%; background: linear-gradient(90deg, #2bb6c9, #52b788); border-radius: 99px; }
.aq-goal { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; color: var(--muted); }
.aq-goal .art-svg { width: 40px; height: 40px; }
.aq-goal.can { color: #145c2c; }
.tank { position: relative; height: clamp(280px, 46vh, 420px); border-radius: 30px; overflow: hidden; border: 10px solid #e6f4fa; outline: 4px solid #9cc9dc; box-shadow: 0 12px 30px var(--shadow), inset 0 0 50px rgba(0,40,80,.35);
  background: radial-gradient(120% 70% at 50% 0%, #bdf0ff 0%, #5cc4e8 40%, #1f86bd 80%, #146a9a 100%); }
.tank .rays { position: absolute; inset: 0; background: repeating-linear-gradient(105deg, rgba(255,255,255,.16) 0 26px, transparent 26px 80px); mask-image: linear-gradient(180deg, #000, transparent 75%); -webkit-mask-image: linear-gradient(180deg, #000, transparent 75%); pointer-events: none; }
.tank .gravel { position: absolute; left: 0; right: 0; bottom: 0; height: 17%; background: radial-gradient(circle at 20% 40%, #f4a261 0 5px, transparent 6px) 0 0/34px 22px, radial-gradient(circle at 70% 60%, #e9c46a 0 4px, transparent 5px) 0 0/26px 18px, radial-gradient(circle at 50% 50%, #ffb4a2 0 3px, transparent 4px) 0 0/20px 16px, linear-gradient(180deg, #f6dfa9, #e4bf74); border-top: 4px solid #fbe9c0; }
.tank .bgplant { position: absolute; bottom: 8%; width: 130px; height: 170px; opacity: .3; filter: saturate(.6); }
.tank .item { position: absolute; line-height: 0; }
.tank .item svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 6px rgba(0,30,60,.25)); }
.tank .deco { bottom: 3%; transform: translateX(-50%); }
.tank .swim { animation: tswim var(--t) linear infinite alternate; }
@keyframes tswim { from { left: 2%; } to { left: calc(98% - var(--w)); } }
.tank .flip { width: 100%; height: 100%; animation: tflip calc(var(--t) * 2) steps(1, end) infinite; }
@keyframes tflip { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
.tank .flip.rev { animation-name: tflipr; }
@keyframes tflipr { 0% { transform: scaleX(-1); } 50% { transform: scaleX(1); } }
.tank .float { animation: fbob 3.4s ease-in-out infinite; transform: translateX(-50%); }
@keyframes fbob { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-10px); } }
.tank .nemo-fish { font-size: 70px; line-height: 1; }
.tank .tb { position: absolute; bottom: 12%; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); background: rgba(255,255,255,.2); animation: tbub linear infinite; }
@keyframes tbub { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-340px) translateX(12px); opacity: 0; } }
.tank .placed { transform: translateX(-50%); }
.tank.edit { outline-color: var(--gold); outline-width: 6px; }
.tank.edit .item.placed { cursor: grab; touch-action: none; animation: none; }
.tank.edit .item.placed::after { content: ""; position: absolute; inset: -4px; border: 3px dashed rgba(255,255,255,.85); border-radius: 16px; }

    const lv = li === "bonus" ? BONUS : view(levelOf(li), d);
    $("inIcon").textContent = lv.icon; $("inTitle").textContent = lv.name;
    const badge = $("inBadge");
    if (li === "bonus") { badge.className = "badge bonus"; badge.innerHTML = `🎁 Bonus · 3 <span class="coin sm"></span> pro Aufgabe`; }
    else { badge.className = "badge " + d; badge.innerHTML = `${DIFFS[d].icon} ${DIFFS[d].label} · ${DIFFS[d].mult} <span class="coin sm"></span> pro Aufgabe`; }
    $("inText").textContent = lv.intro(d); $("inEx").innerHTML = lv.ex(d);
    $("inGo").onclick = () => startLevel(li, d);
    $("inSay").onclick = () => speak(lv.say(d));
    show("scrIntro");
  }
  function startLevel(li, d) {
    const lv = li === "bonus" ? BONUS : view(levelOf(li), d);
    L = { li, d, lv, items: lv.build(d), pos: 0, mistakes: 0, earned: 0, locked: false, speakNow: null, mult: li === "bonus" ? 3 : DIFFS[d].mult };
    const badge = $("playBadge");
    if (li === "bonus") { badge.className = "badge bonus"; badge.textContent = "🎁 Bonus"; }
    else { badge.className = "badge " + d; badge.textContent = `${DIFFS[d].icon} ${DIFFS[d].label}`; }
    $("taskText").textContent = lv.task(d);
    show("scrPlay");
    renderItem();
  }
  function renderProgress() {
    const p = $("progress"); p.innerHTML = "";
    L.items.forEach((_, k) => p.appendChild(el("i", k < L.pos ? "on" : null)));
  }
  function renderItem() {
    renderProgress(); L.locked = false; L.speakNow = null;
    const stage = $("stage"); stage.innerHTML = ""; $("hint").innerHTML = "";
    L.lv.render(L.items[L.pos], stage, L.d);
  }
  function finishLevel() {
    renderProgress();
    const per = L.mistakes / L.items.length;
    let stars = per <= 0.15 ? 3 : per <= 0.5 ? 2 : 1;
    let perfect = L.mistakes === 0;
    if (L.li !== "bonus" && L.lv.score) { const sc = L.lv.score(L); stars = sc.stars; perfect = sc.perfect; }
    const wasOpen = bonusOpen(CH);
    $("resPerfect").hidden = true; $("resBonus").hidden = true;

    if (L.li === "bonus") {
      const first = !S.bonus[CH.id];
      const chest = 30;
      S.bonus[CH.id] = true; S.coins += chest; S.total += chest; L.earned += chest; save(); setCoins(true);
      $("resTitle").textContent = "Schatz gefunden! 👑";
      $("resStars").innerHTML = "🎁✨";
      $("resPerfect").hidden = false; $("resPerfect").innerHTML = `Die Schatztruhe ist offen: +${chest} <span class="coin sm"></span>`;
      $("resText").textContent = first ? `Du bist ein echter ${CH.name}-Schatzsucher!` : "Super! Du hast den Schatz noch einmal gefunden.";
      confetti(["💰","👑","💎","⭐","🦈","✨"]);
    } else {
      const k = skey(CH, L.li, L.d);
      S.stars[k] = Math.max(S.stars[k] || 0, stars);
      if (perfect) {
        const bonusCoins = 5 * DIFFS[L.d].mult;
        S.coins += bonusCoins; S.total += bonusCoins; L.earned += bonusCoins;
        $("resPerfect").hidden = false; $("resPerfect").innerHTML = `💎 Ohne Fehler! +${bonusCoins} Extra-<span class="coin sm"></span>`;
        S.perfect[pkey(CH, L.li)] = true;
      }
      save(); setCoins(true);
      if (!wasOpen && bonusOpen(CH)) { $("resBonus").hidden = false; $("resBonus").textContent = "🎁 Die Bonusaufgabe „Nemos Schatztruhe“ ist freigeschaltet!"; }
      $("resTitle").textContent = stars === 3 ? "Fantastisch!" : stars === 2 ? "Super gemacht!" : "Geschafft!";
      $("resStars").innerHTML = starStr(stars);
      $("resText").textContent = perfect ? "" : (stars < 3 ? "Spiel nochmal und hol dir 3 Sterne!" : "Schaffst du es auch ohne Fehler? Dann gibt es einen 💎.");
      confetti();
    }
    $("resEarned").innerHTML = `+${L.earned} <span class="coin"></span>`;
    const li = L.li, d = L.d;
    $("resAgain").onclick = () => startLevel(li, d);
    show("scrResult"); sfxWin();
    speak($("resTitle").textContent);
    sendResults();
  }

  /* ---------- Ergebnisse senden ---------- */
  function sendResults() {
    try {
      if (!GFORM.action || !window.fetch) return;
      const lines = [];
      CHAPTERS.filter(c => c.ready).forEach(ch => {
        ch.levels.forEach((lv, li) => {
          const parts = DK.map(d => `${d} ${S.stars[skey(ch, li, d)] || 0}`).join("/");
          lines.push(`${lv.name}: ${parts}${S.perfect[pkey(ch, li)] ? " 💎" : ""}`);
        });
        if (S.bonus[ch.id]) lines.push(`${ch.name}-Bonus: geschafft`);
      });
      const body = new URLSearchParams();
      body.append(GFORM.name, S.name || "ohne Namen");
      body.append(GFORM.coins, `${S.total || S.coins} gesammelt (${S.coins} übrig)`);
      body.append(GFORM.stars, lines.join(" | "));
      fetch(GFORM.action, { method: "POST", mode: "no-cors", body })
        .then(() => { S.unsent = false; save(); })
        .catch(() => { S.unsent = true; save(); });
    } catch (e) {}
  }

  /* ---------- certificate ---------- */
  function showCert() {
    $("certName").textContent = S.name || "Du";
    $("certAward").textContent = (CH.award || "Profi") + "!";
    const d = new Date();
    $("certInfo").textContent = `${S.coins} Münzen · ${starTotal(CH)} von ${CH.levels.length * DK.length * 3} Sternen · ${d.toLocaleDateString("de-DE")}`;
    show("scrCert"); confetti(); sfxWin();
  }

  /* ---------- wiring ---------- */
  $("startBtn").addEventListener("click", () => {
    const n = $("nameInput").value.trim();
    S.name = n ? cap(n) : ""; save();
    tone([440], 0.01); renderHome();
  });
  $("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("startBtn").click(); });
  $("backBtn").addEventListener("click", () => { if (current === "scrMap" || current === "scrAqua") renderHome(); else renderMap(); });
  $("wallet").addEventListener("click", () => { if (current === "scrHome" || current === "scrMap") renderAqua(); });
  $("resMap").addEventListener("click", renderMap);
  $("taskSay").addEventListener("click", () => { if (L && L.speakNow) L.speakNow(); else if (L) speak($("taskText").textContent); });
  $("certBtn").addEventListener("click", showCert);
  $("voiceBtn").addEventListener("click", nextVoice);
  $("certBack").addEventListener("click", renderMap);
  $("resetBtn").addEventListener("click", () => { $("confirm").hidden = false; });
  $("sheetBack").addEventListener("click", closeSheet);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  lastP = portrait();
  $("cNo").addEventListener("click", () => { $("confirm").hidden = true; });
  $("cYes").addEventListener("click", () => {
    S = fresh(); save();
    $("confirm").hidden = true; $("nameInput").value = ""; setCoins(false); show("scrStart");
  });

  setCoins(false);
  if (S.unsent) sendResults();
  if (S.name || Object.keys(S.stars).length) renderHome(); else show("scrStart");
})();
</script>
</body>
</html>
