<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiele der Klasse 2a</title>
<style>
:root {
  --deep: #0b3a5c; --sea: #1270a8; --shallow: #3fb4d8;
  --sand: #fff4dc; --sand-edge: #e9cf98; --ink: #17324a; --pearl: #ffd75e; --white: #ffffff;
  --shadow: rgba(4, 30, 52, 0.35);
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { min-height: 100%; margin: 0; }
body {
  background: var(--deep); background-image: linear-gradient(180deg, var(--shallow) 0%, var(--sea) 38%, var(--deep) 100%);
  background-attachment: fixed; color: var(--ink); font-family: var(--font);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.wrap { max-width: 900px; margin: 0 auto; padding-block: max(24px, env(safe-area-inset-top, 0px)) 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 24px; align-items: center; text-align: center; }
.nemo { font-size: 110px; line-height: 1; animation: swim 3s ease-in-out infinite; filter: drop-shadow(0 10px 12px var(--shadow)); }
@keyframes swim { 0%,100% { transform: translateX(-16px) rotate(-4deg); } 50% { transform: translateX(16px) rotate(4deg); } }
h1 { margin: 0; color: var(--white); font-size: clamp(36px, 7vw, 60px); font-weight: 900; text-shadow: 0 4px 0 var(--deep), 0 8px 18px var(--shadow); line-height: 1.05; text-wrap: balance; }
.sub { margin: 0; color: var(--white); font-size: 24px; font-weight: 700; text-shadow: 0 2px 0 var(--deep); }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; }
.game { display: flex; align-items: center; gap: 18px; text-align: left; text-decoration: none; color: var(--ink);
  background: var(--sand); border-radius: 30px; padding: 20px; box-shadow: 0 6px 0 var(--sand-edge), 0 12px 24px var(--shadow); }
.game:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sand-edge); }
.game:focus-visible { outline: 4px solid var(--pearl); outline-offset: 3px; }
.game .ic { width: 84px; height: 84px; flex: none; border-radius: 50%; background: var(--white); border: 4px solid var(--sea); display: grid; place-items: center; font-size: 46px; }
.game .nm { font-size: 28px; font-weight: 900; display: block; }
.game .ds { font-size: 20px; font-weight: 700; color: #5a6b7b; display: block; margin-top: 4px; }
.soon { color: rgba(255,255,255,0.8); font-size: 20px; font-weight: 700; margin: 0; }
@media (prefers-reduced-motion: reduce) { .nemo { animation: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="nemo" aria-hidden="true">🦈</div>
  <h1>Spiele der Klasse 2a</h1>
  <p class="sub">Tippe auf ein Spiel!</p>
  <nav class="games">
    <a class="game" href="nemo/">
      <span class="ic" aria-hidden="true">🐟</span>
      <span><span class="nm">Nemos Nomen-Abenteuer</span><span class="ds">Nomen finden, der/die/das, sortieren</span></span>
    </a>
  </nav>
  <p class="soon">Bald kommen hier neue Spiele dazu. 🫧</p>
</main>
</body>
</html>
